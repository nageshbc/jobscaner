name: Daily India Job Scan

on:
  workflow_dispatch:
  schedule:
    # Every day at 7:30 AM India time.
    - cron: "30 7 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: daily-india-job-scan
  cancel-in-progress: false

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run career-page scan and generate PDF/CSV
        run: python jobfinder.py

      - name: Upload dated reports
        uses: actions/upload-artifact@v4
        with:
          name: india-job-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
